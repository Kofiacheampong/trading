<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1010" width="1080" height="1010" font-family="DejaVu Sans, Arial, sans-serif">
  <rect x="0" y="0" width="1080" height="1010" fill="#f8fafc"/>

  <!-- Title -->
  <text x="540" y="56" text-anchor="middle" font-size="34" font-weight="bold" fill="#172033">OPTIONS IN 60 SECONDS</text>
  <text x="540" y="88" text-anchor="middle" font-size="17" fill="#5b6475">Calls vs Puts — the only two bets you can make on a stock</text>

  <!-- Anatomy strip -->
  <rect x="40" y="110" width="1000" height="104" rx="12" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="70" y="136" font-size="13" font-weight="bold" fill="#475569">EVERY OPTION HAS 3 NUMBERS</text>
  <rect x="70" y="148" width="300" height="48" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="86" y="178" font-size="13.5" fill="#1f2937"><tspan font-weight="bold">PREMIUM</tspan> — price of the ticket</text>
  <rect x="390" y="148" width="300" height="48" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="406" y="178" font-size="13.5" fill="#1f2937"><tspan font-weight="bold">STRIKE</tspan> — the fixed price in it</text>
  <rect x="710" y="148" width="300" height="48" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="726" y="178" font-size="13.5" fill="#1f2937"><tspan font-weight="bold">EXPIRATION</tspan> — the deadline</text>

  <!-- CALL panel -->
  <rect x="40" y="238" width="490" height="410" rx="14" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="70" y="288" font-size="30" font-weight="bold" fill="#065f46">CALL</text>
  <text x="70" y="316" font-size="16" fill="#065f46">= the right to BUY at the strike</text>
  <line x1="452" y1="250" x2="452" y2="274" stroke="#059669" stroke-width="3"/>
  <polygon points="452,284 434,260 470,260" fill="#059669"/>
  <text x="70" y="350" font-size="14" font-weight="bold" fill="#065f46">You buy it when you think the stock goes UP</text>

  <rect x="70" y="370" width="430" height="112" rx="10" fill="#ffffff" stroke="#10b981"/>
  <text x="88" y="396" font-size="12" font-weight="bold" fill="#047857">EXAMPLE</text>
  <text x="88" y="418" font-size="13.5" fill="#1f2937">Pay $2 for the $50 CALL ticket.</text>
  <text x="88" y="440" font-size="13.5" fill="#1f2937">Stock rises to $60 → ticket worth ~$10 (5× your money).</text>
  <text x="88" y="462" font-size="13.5" fill="#1f2937">Stock stays under $52 → ticket expires → you lose $2.</text>

  <text x="70" y="506" font-size="14" fill="#065f46"><tspan font-weight="bold">Max loss:</tspan> only the premium you paid ($2)</text>
  <text x="70" y="534" font-size="14" fill="#065f46"><tspan font-weight="bold">Max gain:</tspan> unlimited — the stock can rise forever</text>
  <text x="70" y="562" font-size="14" fill="#065f46"><tspan font-weight="bold">Use when:</tspan> you expect the stock to go UP</text>
  <text x="70" y="590" font-size="14" fill="#065f46"><tspan font-weight="bold">Real check:</tspan> stock must clear strike + premium to profit</text>

  <!-- PUT panel -->
  <rect x="550" y="238" width="490" height="410" rx="14" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="580" y="288" font-size="30" font-weight="bold" fill="#991b1b">PUT</text>
  <text x="580" y="316" font-size="16" fill="#991b1b">= the right to SELL at the strike</text>
  <line x1="962" y1="252" x2="962" y2="276" stroke="#dc2626" stroke-width="3"/>
  <polygon points="962,286 944,262 980,262" fill="#dc2626"/>
  <text x="580" y="350" font-size="14" font-weight="bold" fill="#991b1b">You buy it when you think the stock goes DOWN</text>

  <rect x="580" y="370" width="430" height="112" rx="10" fill="#ffffff" stroke="#ef4444"/>
  <text x="598" y="396" font-size="12" font-weight="bold" fill="#b91c1c">EXAMPLE</text>
  <text x="598" y="418" font-size="13.5" fill="#1f2937">Pay $2 for the $50 PUT ticket.</text>
  <text x="598" y="440" font-size="13.5" fill="#1f2937">Stock falls to $40 → ticket worth ~$10 (5× your money).</text>
  <text x="598" y="462" font-size="13.5" fill="#1f2937">Stock stays above $48 → ticket expires → you lose $2.</text>

  <text x="580" y="506" font-size="14" fill="#991b1b"><tspan font-weight="bold">Max loss:</tspan> only the premium you paid ($2)</text>
  <text x="580" y="534" font-size="14" fill="#991b1b"><tspan font-weight="bold">Max gain:</tspan> up to the strike (stock can only hit $0)</text>
  <text x="580" y="562" font-size="14" fill="#991b1b"><tspan font-weight="bold">Use when:</tspan> you expect a drop — or you own the stock</text>
  <text x="580" y="590" font-size="14" fill="#991b1b"><tspan font-weight="bold">Real check:</tspan> stock must fall below strike − premium</text>

  <!-- Moneyness band: where's the strike -->
  <rect x="40" y="668" width="1000" height="170" rx="14" fill="#c7d2fe" stroke="#6366f1"/>
  <text x="70" y="694" font-size="13" font-weight="bold" fill="#3730a3">WHERE'S THE STRIKE? — ITM vs OTM (moneyness at a glance)</text>

  <rect x="40" y="706" width="235" height="120" rx="10" fill="#d1fae5" stroke="#10b981"/>
  <text x="52" y="728" font-size="12.5" font-weight="bold" fill="#065f46">CALL · strike BELOW price</text>
  <text x="52" y="750" font-size="13" font-weight="bold" fill="#047857">ITM — already valuable</text>
  <text x="52" y="776" font-size="11.5" fill="#1f2937">Expensive, moves almost 1:1</text>
  <text x="52" y="796" font-size="11.5" fill="#1f2937">with the stock. Example:</text>
  <text x="52" y="816" font-size="11.5" fill="#065f46">PRGO $10C (delta ~1.0)</text>

  <rect x="295" y="706" width="235" height="120" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="307" y="728" font-size="12.5" font-weight="bold" fill="#475569">CALL · strike ABOVE price</text>
  <text x="307" y="750" font-size="13" font-weight="bold" fill="#64748b">OTM — hope ticket</text>
  <text x="307" y="776" font-size="11.5" fill="#1f2937">Cheap, but needs a rally</text>
  <text x="307" y="796" font-size="11.5" fill="#1f2937">to pay. Example: friend's</text>
  <text x="307" y="816" font-size="11.5" fill="#475569">$35C now (TOST ~$34.70)</text>

  <rect x="550" y="706" width="235" height="120" rx="10" fill="#fee2e2" stroke="#ef4444"/>
  <text x="562" y="728" font-size="12.5" font-weight="bold" fill="#991b1b">PUT · strike ABOVE price</text>
  <text x="562" y="750" font-size="13" font-weight="bold" fill="#b91c1c">ITM — already valuable</text>
  <text x="562" y="776" font-size="11.5" fill="#1f2937">Expensive, tracks the drop</text>
  <text x="562" y="796" font-size="11.5" fill="#1f2937">almost 1:1. Example: PRGO</text>
  <text x="562" y="816" font-size="11.5" fill="#991b1b">$15P — $2.55 of real value</text>

  <rect x="805" y="706" width="235" height="120" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="817" y="728" font-size="12.5" font-weight="bold" fill="#475569">PUT · strike BELOW price</text>
  <text x="817" y="750" font-size="13" font-weight="bold" fill="#64748b">OTM — crash ticket</text>
  <text x="817" y="776" font-size="11.5" fill="#1f2937">Cheap, but needs a big</text>
  <text x="817" y="796" font-size="11.5" fill="#1f2937">drop to pay. Example:</text>
  <text x="817" y="816" font-size="11.5" fill="#475569">PRGO $10P (pennies)</text>

  <!-- Real example strip -->
  <rect x="40" y="858" width="1000" height="124" rx="14" fill="#fef3c7" stroke="#d97706"/>
  <text x="70" y="884" font-size="13" font-weight="bold" fill="#92400e">REAL EXAMPLE — TODAY</text>
  <text x="70" y="908" font-size="14" fill="#78350f">Your friend bought a TOST $35 CALL for $1.25 — the right to buy TOST at $35.</text>
  <text x="70" y="930" font-size="14" fill="#78350f">To profit, TOST needed to pass $36.26 (strike + premium). It faded to ~$34.70.</text>
  <text x="70" y="952" font-size="14" fill="#78350f">The ticket lost ~11% in one day. The ticket only wins if the stock keeps</text>
  <text x="70" y="974" font-size="14" fill="#78350f">moving your way before the deadline — that's the whole game.</text>

  <text x="540" y="1004" text-anchor="middle" font-size="12.5" fill="#5b6475">Max loss for a buyer is always the premium. Sellers (writers) take the other side — that's a different game.</text>
</svg>
